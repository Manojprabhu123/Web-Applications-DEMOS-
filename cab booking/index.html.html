<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QuickCab – Book Your Ride</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --yellow: #FFD93D;
    --yellow-dark: #e6c000;
    --dark: #111118;
    --card: #1c1c27;
    --border: #2a2a3a;
    --text: #f0f0f5;
    --muted: #888899;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── PAGES ── */
  .page { display: none; }
  .page.active { display: block; }

  /* ── LOGIN PAGE ── */
  #loginPage {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(ellipse at 60% 20%, #2a2408 0%, var(--dark) 60%);
  }
  #loginPage.active { display: flex; }

  .login-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    animation: fadeUp .4s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo { text-align: center; margin-bottom: 28px; }
  .logo .icon { font-size: 48px; }
  .logo h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .logo h1 span { color: var(--yellow); }
  .logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .tabs {
    display: flex;
    background: #13131e;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .tab-btn {
    flex: 1; padding: 9px; border: none; border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .2s;
    background: transparent; color: var(--muted);
  }
  .tab-btn.active { background: var(--yellow); color: #111; }

  label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .6px; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }

  input, select {
    width: 100%; background: #13131e; border: 1px solid var(--border);
    border-radius: 9px; color: var(--text); padding: 11px 14px;
    font-family: inherit; font-size: 14px; outline: none;
    transition: border-color .2s;
  }
  input:focus, select:focus { border-color: var(--yellow); }
  select option { background: #1c1c27; }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    font-family: inherit; font-weight: 800; font-size: 15px;
    cursor: pointer; transition: all .2s;
  }
  .btn-yellow { background: var(--yellow); color: #111; }
  .btn-yellow:hover { background: var(--yellow-dark); }
  .btn-outline {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); padding: 8px 16px;
    font-size: 13px; border-radius: 8px; font-weight: 600;
  }
  .btn-outline:hover { border-color: var(--yellow); color: var(--yellow); }
  .btn-red { background: #3a1515; color: var(--red); border: 1px solid #5a2020; padding: 6px 14px; font-size: 12px; border-radius: 7px; }
  .btn-red:hover { background: #4a1a1a; }

  .hint {
    background: #1e1a0a; border: 1px solid #3a3000; border-radius: 9px;
    padding: 10px 14px; font-size: 12px; color: var(--muted);
    margin-top: 16px; line-height: 1.7;
  }
  .hint b { color: var(--yellow); }

  .err-msg {
    background: #2a1111; color: var(--red); border-radius: 8px;
    padding: 9px 13px; font-size: 13px; margin-bottom: 14px; display: none;
  }

  /* ── NAV ── */
  nav {
    background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; height: 58px;
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo { font-size: 18px; font-weight: 800; margin-right: auto; }
  .nav-logo span { color: var(--yellow); }
  .nav-links { display: flex; gap: 4px; }
  .nav-link {
    padding: 7px 14px; border-radius: 8px; border: none;
    background: transparent; color: var(--muted);
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .2s;
  }
  .nav-link:hover { color: var(--text); }
  .nav-link.active { background: #2a2408; color: var(--yellow); }
  .nav-user { font-size: 13px; color: var(--muted); margin-left: 16px; }

  /* ── MAIN LAYOUT ── */
  .shell { max-width: 960px; margin: 0 auto; padding: 28px 20px; }

  /* ── SECTION PAGES ── */
  .section { display: none; }
  .section.active { display: block; animation: fadeUp .3s ease; }

  /* ── STAT CARDS ── */
  .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 28px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 16px; text-align: center;
  }
  .stat-icon { font-size: 26px; margin-bottom: 6px; }
  .stat-val { font-size: 22px; font-weight: 800; color: var(--yellow); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── CARD ── */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
  }
  .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

  /* ── BOOKING FORM ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cab-options { display: flex; gap: 10px; margin: 16px 0; }
  .cab-opt {
    flex: 1; padding: 14px 8px; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--border); background: #13131e; text-align: center;
    transition: all .2s;
  }
  .cab-opt:hover { border-color: #444; }
  .cab-opt.selected { border-color: var(--yellow); background: #2a2408; }
  .cab-opt .ico { font-size: 26px; }
  .cab-opt .name { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .cab-opt .price { font-size: 11px; color: var(--muted); }

  .fare-box {
    background: #1e1a0a; border: 1px solid #3a3000; border-radius: 10px;
    padding: 14px 18px; display: flex; justify-content: space-between;
    align-items: center; margin: 16px 0;
  }
  .fare-label { color: var(--muted); font-size: 13px; }
  .fare-val { font-size: 24px; font-weight: 800; color: var(--yellow); }

  .success-msg {
    background: #0d2a18; color: var(--green); border: 1px solid #1a4a28;
    border-radius: 9px; padding: 12px 16px; font-size: 13px;
    font-weight: 600; margin-bottom: 16px; display: none;
  }

  /* ── TABLE ── */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 9px 12px; text-align: left; font-size: 11px;
    font-weight: 700; color: var(--muted); letter-spacing: .5px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 13px 12px; font-size: 13px; border-bottom: 1px solid #1e1e2a; }
  tr:last-child td { border-bottom: none; }

  .badge {
    padding: 3px 10px; border-radius: 20px; font-size: 11px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
  }
  .badge-green  { background: #0d2a18; color: var(--green); }
  .badge-yellow { background: #2a2408; color: var(--yellow); }
  .badge-blue   { background: #0d1e38; color: var(--blue); }
  .badge-red    { background: #2a1111; color: var(--red); }
  .badge-gray   { background: #1e1e2a; color: var(--muted); }

  /* ── PROFILE ── */
  .profile-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px; max-width: 440px;
  }
  .profile-avatar { font-size: 60px; text-align: center; margin-bottom: 8px; }
  .profile-name { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .profile-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .profile-row {
    display: flex; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .profile-row:last-child { border-bottom: none; }
  .profile-key { color: var(--muted); }

  /* ── DRIVER CARDS ── */
  .driver-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }
  .driver-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; display: flex; gap: 14px; align-items: center;
  }
  .driver-avatar { font-size: 44px; }
  .driver-name { font-size: 15px; font-weight: 700; }
  .driver-info { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.7; }
  .driver-actions { margin-top: 8px; display: flex; gap: 8px; align-items: center; }

  /* ── ANALYTICS BARS ── */
  .bar-row { margin-bottom: 14px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar-track { background: #13131e; border-radius: 6px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 1s ease; }

  .week-chart { display: flex; align-items: flex-end; gap: 0; height: 100px; margin-top: 8px; }
  .week-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .week-bar-inner {
    width: 60%; border-radius: 4px 4px 0 0;
    background: linear-gradient(to top, var(--yellow), #ffed8a);
  }
  .week-day { font-size: 10px; color: var(--muted); }
  .week-amt { font-size: 10px; color: var(--yellow); font-weight: 700; }

  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2,1fr); }
    .form-grid { grid-template-columns: 1fr; }
    .driver-grid { grid-template-columns: 1fr; }
    nav { padding: 0 14px; }
    .nav-links { gap: 2px; }
    .nav-link { padding: 6px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ════════ LOGIN PAGE ════════ -->
<div id="loginPage" class="page active">
  <div class="login-box">
    <div class="logo">
      <div class="icon">🚖</div>
      <h1><span>Quick</span>Cab</h1>
      <p>Fast · Reliable · Affordable</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('user')">👤 User Login</button>
      <button class="tab-btn" onclick="switchTab('admin')">🛡️ Admin Login</button>
    </div>

    <div id="loginErr" class="err-msg">❌ Invalid credentials. Please try again.</div>

    <div class="field">
      <label>USERNAME</label>
      <input id="loginUser" type="text" placeholder="Enter username" />
    </div>
    <div class="field">
      <label>PASSWORD</label>
      <input id="loginPass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <button class="btn btn-yellow" onclick="doLogin()">Login →</button>

    <div class="hint" id="loginHint">
      <b>Demo — User:</b> ravi / ravi123 &nbsp;|&nbsp; priya / priya123
    </div>
  </div>
</div>

<!-- ════════ APP SHELL ════════ -->
<div id="appShell" class="page">

  <!-- NAV -->
  <nav>
    <div class="nav-logo">🚖 <span>Quick</span>Cab</div>
    <div class="nav-links" id="navLinks"></div>
    <span class="nav-user" id="navUser"></span>
    <button class="btn-outline" style="margin-left:12px" onclick="logout()">Logout</button>
  </nav>

  <div class="shell" id="appContent"></div>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────
const ACCOUNTS = {
  admin:  { pass: "admin123",  role: "admin",  name: "Admin" },
  ravi:   { pass: "ravi123",   role: "user",   name: "Ravi Kumar",  phone: "98765 43210" },
  priya:  { pass: "priya123",  role: "user",   name: "Priya Sharma", phone: "91234 56789" },
};

const LOCATIONS = ["Chennai Central","Airport","Anna Nagar","T. Nagar","Velachery","Adyar","Tambaram","Porur","Nungambakkam","Sholinganallur"];

const DRIVERS = [
  { id:1, name:"Suresh B.",   vehicle:"Swift Dzire",   plate:"TN01 AB 1234", rating:4.8, status:"available", avatar:"🧑‍✈️" },
  { id:2, name:"Karthik R.",  vehicle:"Innova Crysta", plate:"TN02 CD 5678", rating:4.7, status:"on-trip",   avatar:"👨‍✈️" },
  { id:3, name:"Divya M.",    vehicle:"Hyundai i20",   plate:"TN03 EF 9012", rating:4.9, status:"available", avatar:"👩‍✈️" },
  { id:4, name:"Arun S.",     vehicle:"Toyota Etios",  plate:"TN04 GH 3456", rating:4.5, status:"offline",   avatar:"🧑‍✈️" },
];

let BOOKINGS = [
  { id:"CB001", user:"Ravi Kumar",   pickup:"Chennai Central", drop:"Airport",    date:"2026-03-18", time:"08:00", cab:"Sedan", fare:450, status:"completed", driver:"Suresh B." },
  { id:"CB002", user:"Priya Sharma", pickup:"Anna Nagar",      drop:"T. Nagar",   date:"2026-03-20", time:"14:30", cab:"Mini",  fare:180, status:"on-trip",   driver:"Karthik R." },
  { id:"CB003", user:"Ravi Kumar",   pickup:"Velachery",       drop:"Sholinganallur", date:"2026-03-21", time:"09:00", cab:"SUV", fare:320, status:"confirmed", driver:"Divya M." },
];

const FARES = { Mini: 11, Sedan: 15, SUV: 22 };
const DISTANCES = {};

let currentUser = null;
let currentRole = null;
let activeTab = "";
let selectedCab = "Sedan";
let loginTabMode = "user";

// ── LOGIN ────────────────────────────────────────────────────────────
function switchTab(mode) {
  loginTabMode = mode;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0&&mode==='user')||(i===1&&mode==='admin')));
  document.getElementById('loginHint').innerHTML = mode === 'user'
    ? '<b>Demo — User:</b> ravi / ravi123 &nbsp;|&nbsp; priya / priya123'
    : '<b>Demo — Admin:</b> admin / admin123';
  document.getElementById('loginErr').style.display = 'none';
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value;
  const acc = ACCOUNTS[u];
  const err = document.getElementById('loginErr');

  if (!acc || acc.pass !== p) { err.style.display='block'; return; }
  if (loginTabMode === 'admin' && acc.role !== 'admin') { err.textContent='❌ Not an admin account.'; err.style.display='block'; return; }
  if (loginTabMode === 'user'  && acc.role !== 'user')  { err.textContent='❌ Use Admin Login for admin.'; err.style.display='block'; return; }

  currentUser = { username: u, ...acc };
  currentRole = acc.role;
  err.style.display = 'none';
  document.getElementById('loginPage').classList.remove('active');
  document.getElementById('appShell').classList.add('active');
  document.getElementById('navUser').textContent = acc.name;
  buildNav();
}

function logout() {
  currentUser = null;
  document.getElementById('appShell').classList.remove('active');
  document.getElementById('loginPage').classList.add('active');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

// ── NAV ──────────────────────────────────────────────────────────────
function buildNav() {
  const tabs = currentRole === 'admin'
    ? ['Overview','Bookings','Drivers','Analytics']
    : ['Book a Ride','My Bookings','Profile'];
  const nav = document.getElementById('navLinks');
  nav.innerHTML = tabs.map(t => `<button class="nav-link" onclick="showSection('${t}')">${t}</button>`).join('');
  showSection(tabs[0]);
}

function showSection(name) {
  activeTab = name;
  document.querySelectorAll('.nav-link').forEach(b => b.classList.toggle('active', b.textContent===name));
  const c = document.getElementById('appContent');
  c.innerHTML = '';
  if (currentRole === 'admin') renderAdmin(name, c);
  else renderUser(name, c);
}

// ── HELPERS ──────────────────────────────────────────────────────────
function badge(s) {
  const map = { completed:'green', 'on-trip':'yellow', confirmed:'blue', cancelled:'red', available:'green', offline:'gray' };
  return `<span class="badge badge-${map[s]||'gray'}">${s}</span>`;
}

function statCard(icon, val, label) {
  return `<div class="stat-card"><div class="stat-icon">${icon}</div><div class="stat-val">${val}</div><div class="stat-label">${label}</div></div>`;
}

function myBookings() { return BOOKINGS.filter(b => b.user === currentUser.name); }

function estimateFare(pickup, drop, cab) {
  const key = pickup + drop;
  if (!DISTANCES[key]) DISTANCES[key] = Math.floor(Math.random()*18+4);
  return DISTANCES[key] * FARES[cab] + 30;
}

// ── USER SECTIONS ─────────────────────────────────────────────────────
function renderUser(tab, c) {
  if (tab === 'Book a Ride') c.innerHTML = bookRideHTML();
  if (tab === 'My Bookings') c.innerHTML = myBookingsHTML();
  if (tab === 'Profile')     c.innerHTML = profileHTML();
  if (tab === 'Book a Ride') initBookForm();
}

function bookRideHTML() {
  const opts = ['Mini','Sedan','SUV'];
  const icons = ['🚗','🚕','🚙'];
  const descs = ['Hatchback · ₹11/km','Comfortable · ₹15/km','Spacious · ₹22/km'];
  return `
  <div class="card">
    <h2>🗺️ Book Your Ride</h2>
    <div id="successMsg" class="success-msg">✅ Ride booked! Driver is on the way.</div>
    <div class="form-grid">
      <div class="field">
        <label>PICKUP LOCATION</label>
        <select id="fPickup" onchange="updateFare()">
          <option value="">-- Select Pickup --</option>
          ${LOCATIONS.map(l=>`<option>${l}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>DROP LOCATION</label>
        <select id="fDrop" onchange="updateFare()">
          <option value="">-- Select Drop --</option>
          ${LOCATIONS.map(l=>`<option>${l}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>DATE</label>
        <input type="date" id="fDate" value="2026-03-22" />
      </div>
      <div class="field">
        <label>TIME</label>
        <input type="time" id="fTime" value="10:00" />
      </div>
    </div>
    <label style="margin-top:8px;display:block">CAB TYPE</label>
    <div class="cab-options">
      ${opts.map((o,i)=>`
        <div class="cab-opt${o==='Sedan'?' selected':''}" onclick="selectCab('${o}',this)">
          <div class="ico">${icons[i]}</div>
          <div class="name">${o}</div>
          <div class="price">${descs[i]}</div>
        </div>`).join('')}
    </div>
    <div class="fare-box" id="fareBox" style="display:none">
      <span class="fare-label">Estimated Fare</span>
      <span class="fare-val" id="fareVal">₹0</span>
    </div>
    <button class="btn btn-yellow" onclick="bookRide()" style="margin-top:8px">Book Now 🚖</button>
  </div>`;
}

function selectCab(type, el) {
  selectedCab = type;
  document.querySelectorAll('.cab-opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  updateFare();
}

function updateFare() {
  const p = document.getElementById('fPickup').value;
  const d = document.getElementById('fDrop').value;
  const box = document.getElementById('fareBox');
  if (p && d && p !== d) {
    box.style.display = 'flex';
    document.getElementById('fareVal').textContent = '₹' + estimateFare(p, d, selectedCab);
  } else { box.style.display = 'none'; }
}

function initBookForm() { /* fare auto-updates via onchange */ }

function bookRide() {
  const p = document.getElementById('fPickup').value;
  const d = document.getElementById('fDrop').value;
  const dt = document.getElementById('fDate').value;
  const tm = document.getElementById('fTime').value;
  if (!p || !d || p === d) { alert('Please select valid pickup and drop locations.'); return; }
  const driver = DRIVERS.find(dr=>dr.status==='available');
  const fare = estimateFare(p, d, selectedCab);
  BOOKINGS.unshift({
    id: 'CB' + String(Date.now()).slice(-3),
    user: currentUser.name, pickup: p, drop: d, date: dt, time: tm,
    cab: selectedCab, fare, status: 'confirmed',
    driver: driver ? driver.name : 'Assigning...'
  });
  const msg = document.getElementById('successMsg');
  msg.style.display = 'block';
  document.getElementById('fPickup').value = '';
  document.getElementById('fDrop').value = '';
  document.getElementById('fareBox').style.display = 'none';
  setTimeout(()=>msg.style.display='none', 4000);
}

function myBookingsHTML() {
  const bks = myBookings();
  if (!bks.length) return `<div class="card"><h2>📋 My Bookings</h2><p style="color:var(--muted)">No bookings yet.</p></div>`;
  return `<div class="card">
    <h2>📋 My Bookings</h2>
    <div class="tbl-wrap"><table>
      <tr><th>ID</th><th>Pickup</th><th>Drop</th><th>Date</th><th>Cab</th><th>Driver</th><th>Fare</th><th>Status</th></tr>
      ${bks.map(b=>`<tr>
        <td style="color:var(--yellow);font-weight:700">${b.id}</td>
        <td>${b.pickup}</td><td>${b.drop}</td>
        <td style="color:var(--muted)">${b.date} ${b.time}</td>
        <td>${b.cab}</td><td>${b.driver}</td>
        <td style="font-weight:700">₹${b.fare}</td>
        <td>${badge(b.status)}</td>
      </tr>`).join('')}
    </table></div>
  </div>`;
}

function profileHTML() {
  const u = currentUser;
  const acc = ACCOUNTS[u.username];
  return `<div class="profile-card">
    <div class="profile-avatar">👤</div>
    <div class="profile-name">${u.name}</div>
    <div class="profile-sub">@${u.username}</div>
    <div class="profile-row"><span class="profile-key">📞 Phone</span><span>${acc.phone||'–'}</span></div>
    <div class="profile-row"><span class="profile-key">📧 Email</span><span>${u.username}@quickcab.com</span></div>
    <div class="profile-row"><span class="profile-key">🚖 Total Rides</span><span>${myBookings().length + 3}</span></div>
    <div class="profile-row"><span class="profile-key">💰 Total Spent</span><span>₹${myBookings().reduce((a,b)=>a+b.fare,0)+650}</span></div>
    <div class="profile-row"><span class="profile-key">🏆 Loyalty Points</span><span style="color:var(--yellow)">340 pts</span></div>
  </div>`;
}

// ── ADMIN SECTIONS ────────────────────────────────────────────────────
function renderAdmin(tab, c) {
  if (tab === 'Overview')   c.innerHTML = adminOverviewHTML();
  if (tab === 'Bookings')   c.innerHTML = adminBookingsHTML();
  if (tab === 'Drivers')    c.innerHTML = adminDriversHTML();
  if (tab === 'Analytics')  c.innerHTML = adminAnalyticsHTML();
}

function adminOverviewHTML() {
  const total = BOOKINGS.length;
  const active = BOOKINGS.filter(b=>b.status==='on-trip').length;
  const rev = BOOKINGS.reduce((a,b)=>a+b.fare,0)+2400;
  const avail = DRIVERS.filter(d=>d.status==='available').length;
  return `
  <div class="stats">
    ${statCard('📋', total, 'Total Bookings')}
    ${statCard('🟢', active, 'Active Trips')}
    ${statCard('👨‍✈️', avail+'/'+DRIVERS.length, 'Drivers Available')}
    ${statCard('💰', '₹'+rev, 'Total Revenue')}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
    <div class="card">
      <h2>🚕 Driver Status</h2>
      ${DRIVERS.map(d=>`
        <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:32px">${d.avatar}</span>
          <div style="flex:1">
            <div style="font-weight:700;font-size:14px">${d.name}</div>
            <div style="font-size:12px;color:var(--muted)">${d.vehicle} · ⭐${d.rating}</div>
          </div>
          ${badge(d.status)}
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>📋 Recent Bookings</h2>
      ${BOOKINGS.slice(0,4).map(b=>`
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:700;color:var(--yellow);font-size:13px">${b.id}</div>
            <div style="font-size:12px;color:var(--muted)">${b.pickup} → ${b.drop}</div>
            <div style="font-size:12px;color:var(--muted)">${b.user}</div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:700">₹${b.fare}</div>
            ${badge(b.status)}
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function adminBookingsHTML() {
  return `<div class="card">
    <h2>📋 All Bookings</h2>
    <div class="tbl-wrap"><table>
      <tr><th>ID</th><th>User</th><th>Pickup</th><th>Drop</th><th>Date</th><th>Driver</th><th>Cab</th><th>Fare</th><th>Status</th><th>Action</th></tr>
      ${BOOKINGS.map(b=>`<tr>
        <td style="color:var(--yellow);font-weight:700">${b.id}</td>
        <td>${b.user}</td><td>${b.pickup}</td><td>${b.drop}</td>
        <td style="color:var(--muted);font-size:12px">${b.date}<br/>${b.time}</td>
        <td>${b.driver}</td><td>${b.cab}</td>
        <td style="font-weight:700">₹${b.fare}</td>
        <td>${badge(b.status)}</td>
        <td>${b.status!=='cancelled'&&b.status!=='completed'
          ?`<button class="btn-red" onclick="cancelBooking('${b.id}')">Cancel</button>`
          :'–'}
        </td>
      </tr>`).join('')}
    </table></div>
  </div>`;
}

function cancelBooking(id) {
  BOOKINGS = BOOKINGS.map(b=>b.id===id?{...b,status:'cancelled'}:b);
  showSection('Bookings');
}

function adminDriversHTML() {
  return `<div class="driver-grid">
    ${DRIVERS.map(d=>`
      <div class="driver-card">
        <div class="driver-avatar">${d.avatar}</div>
        <div style="flex:1">
          <div class="driver-name">${d.name}</div>
          <div class="driver-info">
            🚘 ${d.vehicle}<br/>
            🔖 ${d.plate}<br/>
            ⭐ ${d.rating} rating
          </div>
          <div class="driver-actions">
            ${badge(d.status)}
            <button class="btn-outline" style="font-size:12px;padding:5px 12px" onclick="toggleDriver(${d.id})">
              ${d.status==='offline'?'Activate':'Deactivate'}
            </button>
          </div>
        </div>
      </div>`).join('')}
  </div>`;
}

function toggleDriver(id) {
  const d = DRIVERS.find(x=>x.id===id);
  if (d) d.status = d.status==='offline' ? 'available' : 'offline';
  showSection('Drivers');
}

function adminAnalyticsHTML() {
  const items = [['Completed',12,'var(--green)'],['On-Trip',2,'var(--yellow)'],['Confirmed',3,'var(--blue)'],['Cancelled',1,'var(--red)']];
  const total = items.reduce((a,i)=>a+i[1],0);
  const cabItems = [['Sedan',9,'var(--blue)'],['Mini',5,'var(--yellow)'],['SUV',4,'#a855f7']];
  const cabTotal = cabItems.reduce((a,i)=>a+i[1],0);
  const week = [['Mon',820],['Tue',1100],['Wed',650],['Thu',940],['Fri',1380],['Sat',1650],['Sun',890]];
  const maxW = Math.max(...week.map(w=>w[1]));
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px">
    <div class="card">
      <h2>📊 Booking Status</h2>
      ${items.map(([l,v,c])=>`
        <div class="bar-row">
          <div class="bar-label"><span>${l}</span><span style="color:${c};font-weight:700">${v} (${Math.round(v/total*100)}%)</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/total*100)}%;background:${c}"></div></div>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>🚗 Cab Type Demand</h2>
      ${cabItems.map(([l,v,c])=>`
        <div class="bar-row">
          <div class="bar-label"><span>${l}</span><span style="color:${c};font-weight:700">${v} (${Math.round(v/cabTotal*100)}%)</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/cabTotal*100)}%;background:${c}"></div></div>
        </div>`).join('')}
    </div>
  </div>
  <div class="card">
    <h2>💰 Revenue This Week</h2>
    <div class="week-chart">
      ${week.map(([d,v])=>`
        <div class="week-bar">
          <div class="week-amt">₹${v}</div>
          <div class="week-bar-inner" style="height:${Math.round(v/maxW*80)}px"></div>
          <div class="week-day">${d}</div>
        </div>`).join('')}
    </div>
  </div>`;
}
</script>
</body>
</html>
